<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepBoost Life</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
    .glass-nav { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.1); }
    .emerald-gradient { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
  </style>
</head>
<body class="pb-24">

  <!-- Header -->
  <header class="p-5 flex justify-between items-center">
    <div>
      <p class="text-xs text-emerald-400 font-semibold tracking-wider uppercase">DeepBoost Life</p>
      <h1 class="text-2xl font-bold">Good Day, Rahul 👋</h1>
    </div>
    <button onclick="toggleSettings()" class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-lg">⚙️</button>
  </header>

  <!-- Main Balance Banner -->
  <section class="px-5">
    <div class="glass-card p-6 emerald-gradient text-white shadow-xl relative overflow-hidden">
      <p class="text-xs font-medium text-emerald-100 uppercase tracking-wider">Total Net Balance</p>
      <h2 id="totalBalance" class="text-4xl font-extrabold my-2">₹0.00</h2>
      <div class="flex justify-between text-xs pt-2 border-t border-emerald-400/30">
        <span>▲ Income: <b id="totalIncome">₹0</b></span>
        <span>▼ Expense: <b id="totalExpense">₹0</b></span>
      </div>
    </div>
  </section>

  <!-- Quick Actions -->
  <section class="p-5 grid grid-cols-4 gap-3 text-center text-xs">
    <button onclick="openModal('expense')" class="glass-card p-3 flex flex-col items-center gap-1 active:scale-95 transition">
      <span class="text-xl">💸</span> <span>Add Spent</span>
    </button>
    <button onclick="openModal('income')" class="glass-card p-3 flex flex-col items-center gap-1 active:scale-95 transition">
      <span class="text-xl">💰</span> <span>Add Income</span>
    </button>
    <button onclick="openModal('goal')" class="glass-card p-3 flex flex-col items-center gap-1 active:scale-95 transition">
      <span class="text-xl">🎯</span> <span>Set Goal</span>
    </button>
    <button onclick="openModal('task')" class="glass-card p-3 flex flex-col items-center gap-1 active:scale-95 transition">
      <span class="text-xl">📝</span> <span>New Task</span>
    </button>
  </section>

  <!-- Recent Activity -->
  <section class="px-5">
    <h3 class="text-lg font-bold mb-3">Recent Transactions</h3>
    <div id="txList" class="space-y-3">
      <!-- Dynamic Transactions will appear here -->
    </div>
  </section>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-end z-50">
    <div class="glass-card w-full p-6 rounded-t-3xl bg-slate-900 border-t border-white/20">
      <h3 class="text-xl font-bold mb-4">Settings & Sync</h3>
      <label class="text-xs text-slate-400">Google Apps Script Web App URL</label>
      <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-sm mt-1 mb-4 text-white">
      <button onclick="saveSettings()" class="w-full py-3 emerald-gradient rounded-xl font-bold">Save Settings</button>
      <button onclick="toggleSettings()" class="w-full py-3 mt-2 text-slate-400 text-sm">Close</button>
    </div>
  </div>

  <!-- Dynamic Form Modal -->
  <div id="formModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-end z-50">
    <div class="glass-card w-full p-6 rounded-t-3xl bg-slate-900 border-t border-white/20">
      <h3 id="modalTitle" class="text-xl font-bold mb-4">Add Entry</h3>
      <input type="number" id="txAmount" placeholder="Amount (₹)" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mb-3 text-white">
      <input type="text" id="txNote" placeholder="Note / Description" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mb-3 text-white">
      <select id="txAccount" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mb-3 text-white">
        <option value="HDFC Bank">HDFC Bank</option>
        <option value="GPay / Wallet">GPay / Wallet</option>
        <option value="Cash">Cash</option>
        <option value="Credit Card">Credit Card</option>
      </select>
      <button onclick="submitEntry()" class="w-full py-3 emerald-gradient rounded-xl font-bold">Save & Sync</button>
      <button onclick="closeModal()" class="w-full py-3 mt-2 text-slate-400 text-sm">Cancel</button>
    </div>
  </div>

  <script>
    let state = { transactions: [], type: 'expense' };
    const userId = "USER_" + (localStorage.getItem("db_user") || Math.random().toString(36).substring(7));
    localStorage.setItem("db_user", userId);

    function openModal(type) {
      state.type = type;
      document.getElementById('modalTitle').innerText = `Add ${type.toUpperCase()}`;
      document.getElementById('formModal').classList.remove('hidden');
    }
    function closeModal() { document.getElementById('formModal').classList.add('hidden'); }
    function toggleSettings() { document.getElementById('settingsModal').classList.toggle('hidden'); }

    function saveSettings() {
      const url = document.getElementById('scriptUrl').value;
      localStorage.setItem('gsheet_url', url);
      alert('Settings Saved!');
      toggleSettings();
    }

    function submitEntry() {
      const amount = parseFloat(document.getElementById('txAmount').value);
      const note = document.getElementById('txNote').value;
      const account = document.getElementById('txAccount').value;

      if (!amount) return alert('Enter valid amount');

      const entry = { type: state.type, amount, note, account, date: new Date().toLocaleTimeString() };
      state.transactions.unshift(entry);
      updateUI();
      closeModal();
      syncToBackend(entry);
    }

    function updateUI() {
      let inc = 0, exp = 0;
      const list = document.getElementById('txList');
      list.innerHTML = '';

      state.transactions.forEach(t => {
        if (t.type === 'income') inc += t.amount;
        if (t.type === 'expense') exp += t.amount;

        list.innerHTML += `
          <div class="glass-card p-4 flex justify-between items-center">
            <div>
              <p class="font-bold text-sm">${t.note || t.account}</p>
              <p class="text-xs text-slate-400">${t.account} • ${t.date}</p>
            </div>
            <span class="font-extrabold ${t.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}">
              ${t.type === 'income' ? '+' : '-'}₹${t.amount}
            </span>
          </div>
        `;
      });

      document.getElementById('totalBalance').innerText = `₹${(inc - exp).toFixed(2)}`;
      document.getElementById('totalIncome').innerText = `₹${inc}`;
      document.getElementById('totalExpense').innerText = `₹${exp}`;
    }

    async function syncToBackend(payload) {
      const url = localStorage.getItem('gsheet_url');
      if (!url) return;
      try {
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, action: 'ADD_TRANSACTION', payload })
        });
      } catch (e) { console.error('Sync Error:', e); }
    }
  </script>
</body>
</html>
