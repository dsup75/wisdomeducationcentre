<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepBoost Life</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'SF Pro Display', -apple-system, sans-serif; }
        .ios-card {
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen pb-24">

    <!-- Header -->
    <header class="p-5 flex justify-between items-center sticky top-0 z-40 bg-black/70 backdrop-blur-md">
        <div>
            <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
                DeepBoost <span class="text-[10px] bg-emerald-500/20 px-2 py-0.5 rounded-full">LIFE</span>
            </h1>
            <p class="text-[10px] text-gray-400">All-In-One Productivity Hub</p>
        </div>
        <button onclick="toggleTheme()" class="p-2.5 rounded-full ios-card text-emerald-400 text-xs">Theme</button>
    </header>

    <!-- Main Content -->
    <main class="px-4 space-y-4 max-w-md mx-auto">
        <!-- Finance Card -->
        <div class="ios-card p-5 border-l-4 border-emerald-500 space-y-2">
            <p class="text-xs text-gray-400">Total Net Balance</p>
            <h2 class="text-3xl font-extrabold">₹ 1,45,200</h2>
            <div class="grid grid-cols-2 pt-2 border-t border-white/10 text-xs">
                <div><span class="text-gray-400">Income:</span> <p class="text-emerald-400 font-bold">₹ 45,000</p></div>
                <div><span class="text-gray-400">Expenses:</span> <p class="text-red-400 font-bold">₹ 12,400</p></div>
            </div>
        </div>

        <!-- Quick Modules -->
        <div class="ios-card p-4 space-y-2">
            <h3 class="text-sm font-bold text-emerald-400">Study & Business Quick View</h3>
            <p class="text-xs text-gray-300">Physics Rotational Dynamics - 1.5 hrs completed</p>
            <p class="text-xs text-gray-300">Apex Studio Invoices - Waiting Approval</p>
        </div>

        <!-- Sheets Sync Settings -->
        <div class="ios-card p-4 space-y-2">
            <h3 class="text-sm font-bold text-emerald-400">Google Sheets Sync</h3>
            <input type="text" id="sheetUrl" placeholder="Apps Script Web App URL" class="w-full bg-white/5 border border-white/10 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
            <button onclick="saveSheetUrl()" class="w-full bg-emerald-500 text-white font-semibold py-2.5 rounded-xl text-xs">Save URL</button>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-black/80 backdrop-blur-md">
        <div class="ios-card flex justify-around py-3 px-4 text-xs font-medium text-emerald-400">
            <span>Dashboard</span>
            <span>Finance</span>
            <span>Study</span>
            <span>Business</span>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }
        function saveSheetUrl() {
            const url = document.getElementById('sheetUrl').value;
            localStorage.setItem('apps_script_url', url);
            alert('Google Sheets URL Saved Successfully!');
        }
    </script>
</body>
</html>
