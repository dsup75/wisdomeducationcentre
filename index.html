<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DeepBoost Life</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Inline Fallback & Custom Glassmorphism Styles */
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #064e3b 100%);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: #f8fafc;
      margin: 0;
      padding-bottom: 80px; /* Space for floating bottom nav */
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
    }

    .brand-gradient {
      background: linear-gradient(135deg, #10b981 0%, #0d9488 100%);
    }

    /* Hide scrollbars for smooth UI */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="antialiased">

  <!-- Main Container -->
  <div id="app" class="max-w-md mx-auto px-4 pt-6">

    <!-- Header Section -->
    <header class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <div id="user-avatar" class="w-10 h-10 rounded-full brand-gradient flex items-center justify-center font-bold text-white shadow-lg">
          DB
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight">DeepBoost Life</h1>
          <p class="text-xs text-emerald-400">Plan · Save · Study · Achieve</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span id="sync-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]" title="Synced"></span>
      </div>
    </header>

    <!-- Total Balance Card -->
    <div class="glass-card p-5 mb-6 brand-gradient shadow-xl text-white relative overflow-hidden">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-medium opacity-90">Total Balance</span>
        <button id="toggle-privacy" class="opacity-80 hover:opacity-100 text-sm">👁️</button>
      </div>
      <div id="balance-amount" class="text-3xl font-extrabold mb-1">₹0.00</div>
      <div class="text-xs opacity-80">2 Active Accounts</div>
    </div>

    <!-- Quick Actions Grid -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <button class="glass-card p-3 flex items-center gap-3 active:scale-95 transition-transform">
        <span class="p-2 rounded-xl bg-emerald-500/20 text-emerald-400">📈</span>
        <span class="text-sm font-medium">Add Income</span>
      </button>
      <button class="glass-card p-3 flex items-center gap-3 active:scale-95 transition-transform">
        <span class="p-2 rounded-xl bg-rose-500/20 text-rose-400">📉</span>
        <span class="text-sm font-medium">Add Expense</span>
      </button>
    </div>

    <!-- Dashboard Content Placeholder -->
    <main id="main-content" class="glass-card p-4 text-center text-sm text-slate-300">
      App ready. Data offline-first save hoga aur sync URL set karne par back up ho jayega.
    </main>

  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-4 left-1/2 -translate-x-1/2 max-w-md w-[92%] glass-card p-2 flex items-center justify-between shadow-2xl z-50">
    <button class="flex-1 py-2 text-center text-xs text-emerald-400 font-medium">Today</button>
    <button class="flex-1 py-2 text-center text-xs text-slate-400">Money</button>
    <button class="w-12 h-12 rounded-full brand-gradient text-white text-xl flex items-center justify-center -mt-6 shadow-lg shadow-emerald-500/40 active:scale-90 transition-transform">+</button>
    <button class="flex-1 py-2 text-center text-xs text-slate-400">Study</button>
    <button class="flex-1 py-2 text-center text-xs text-slate-400">Tasks</button>
  </nav>

  <!-- Application Logic Script -->
  <script>
    // 1. App Web App URL Configuration
    const SYNC_URL = "PASTE_WEB_APP_URL_HERE";

    // 2. LocalStorage Helper (Namespaced & Offline-First)
    const STORAGE_KEY = "deepboost_life_v6_default";

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : { transactions: [], accounts: [], tasks: [] };
      } catch (err) {
        console.error("Storage Read Error:", err);
        return { transactions: [], accounts: [], tasks: [] };
      }
    }

    function saveData(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (err) {
        console.error("Storage Write Error:", err);
      }
    }

    // 3. Init logic
    document.addEventListener("DOMContentLoaded", () => {
      const data = loadData();
      console.log("DeepBoost Life initialized with data:", data);
    });
  </script>
</body>
</html>
