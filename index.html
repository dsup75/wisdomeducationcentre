<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepBoost Life - Web Sandbox Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
    .emerald-gradient { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
  </style>
</head>
<body class="p-5 pb-24 max-w-md mx-auto">

  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <div>
      <p class="text-xs text-emerald-400 font-semibold tracking-wider uppercase">DeepBoost Life Sandbox</p>
      <h1 class="text-xl font-bold">Dashboard Test 👋</h1>
    </div>
    <span class="text-xs px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Live Test</span>
  </div>

  <!-- Total Balance Card -->
  <div class="glass-card p-6 emerald-gradient text-white shadow-xl mb-6">
    <p class="text-xs font-medium text-emerald-100 uppercase tracking-wider">Total Net Balance</p>
    <h2 id="netBalance" class="text-3xl font-extrabold my-2">₹0.00</h2>
    <div class="flex justify-between text-xs pt-2 border-t border-emerald-400/30">
      <span>Income: <b id="totInc">₹0</b></span>
      <span>Expense: <b id="totExp">₹0</b></span>
    </div>
  </div>

  <!-- Actions -->
  <div class="grid grid-cols-3 gap-3 mb-6 text-center text-xs">
    <button onclick="addEntry('income')" class="glass-card p-3 font-medium active:scale-95 transition">💰 Income</button>
    <button onclick="addEntry('expense')" class="glass-card p-3 font-medium active:scale-95 transition">💸 Expense</button>
    <button onclick="addGoal()" class="glass-card p-3 font-medium active:scale-95 transition">🎯 Goal</button>
  </div>

  <!-- Activity Log -->
  <h3 class="text-sm font-bold text-slate-400 mb-3 uppercase tracking-wider">Transactions</h3>
  <div id="sandboxList" class="space-y-3">
    <p class="text-xs text-slate-500 text-center py-4">No entries yet. Click buttons above.</p>
  </div>

  <script>
    let sandboxData = [];

    function addEntry(type) {
      const amount = prompt(`Enter ${type} amount (₹):`, "500");
      if (!amount) return;
      const note = prompt("Enter description:", type === 'income' ? "Salary" : "Groceries");
      
      sandboxData.unshift({ type, amount: parseFloat(amount), note: note || type, date: new Date().toLocaleTimeString() });
      renderSandbox();
    }

    function addGoal() {
      const goalName = prompt("Enter Goal Name:", "New Phone");
      if (!goalName) return;
      const target = prompt("Enter Target Amount (₹):", "30000");
      
      sandboxData.unshift({ type: 'goal', amount: parseFloat(target), note: `Goal: ${goalName}`, date: 'Savings Jar' });
      renderSandbox();
    }

    function renderSandbox() {
      let inc = 0, exp = 0;
      const list = document.getElementById('sandboxList');
      list.innerHTML = '';

      if (sandboxData.length === 0) {
        list.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">No entries yet.</p>';
        return;
      }

      sandboxData.forEach(item => {
        if (item.type === 'income') inc += item.amount;
        if (item.type === 'expense') exp += item.amount;

        list.innerHTML += `
          <div class="glass-card p-4 flex justify-between items-center text-sm">
            <div>
              <p class="font-bold">${item.note}</p>
              <p class="text-xs text-slate-400">${item.date}</p>
            </div>
            <span class="font-extrabold ${item.type === 'income' ? 'text-emerald-400' : item.type === 'expense' ? 'text-rose-400' : 'text-cyan-400'}">
              ${item.type === 'income' ? '+' : item.type === 'expense' ? '-' : '🎯'}₹${item.amount}
            </span>
          </div>
        `;
      });

      document.getElementById('netBalance').innerText = `₹${(inc - exp).toFixed(2)}`;
      document.getElementById('totInc').innerText = `₹${inc}`;
      document.getElementById('totExp').innerText = `₹${exp}`;
    }
  </script>
</body>
</html>
